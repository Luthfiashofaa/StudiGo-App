<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudiGo - Redirecting...</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }
    .container {
      text-align: center;
      padding: 2rem;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
      max-width: 400px;
    }
    .spinner {
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-top: 4px solid white;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 1rem;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    h1 {
      font-size: 24px;
      margin: 0 0 1rem;
    }
    p {
      font-size: 16px;
      opacity: 0.9;
      margin: 0;
    }
    .error {
      background: rgba(239, 68, 68, 0.2);
      color: #fecaca;
      padding: 1rem;
      border-radius: 8px;
      margin-top: 1rem;
    }
    .manual-link {
      margin-top: 1.5rem;
      padding: 0.75rem 1.5rem;
      background: white;
      color: #667eea;
      text-decoration: none;
      border-radius: 8px;
      display: inline-block;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="spinner"></div>
    <h1>Redirecting to StudiGo App...</h1>
    <p id="status">Please wait while we redirect you.</p>
    <div id="error" class="error" style="display: none;"></div>
    <a id="manual-link" class="manual-link" style="display: none;">Open App Manually</a>
  </div>

  <script>
    (function() {
      const statusEl = document.getElementById('status');
      const errorEl = document.getElementById('error');
      const manualLinkEl = document.getElementById('manual-link');

      // Get all the tokens from URL fragment
      const hash = window.location.hash.substring(1);
      const params = new URLSearchParams(hash);
      
      const accessToken = params.get('access_token');
      const refreshToken = params.get('refresh_token');
      const tokenType = params.get('token_type');
      const type = params.get('type');
      const expiresIn = params.get('expires_in');

      console.log('Auth callback received:', { type, accessToken, refreshToken });

      if (!accessToken) {
        statusEl.textContent = 'No authentication token received.';
        errorEl.textContent = 'Unable to complete authentication. Please try requesting a new reset link.';
        errorEl.style.display = 'block';
        return;
      }

      // Build deep link with all parameters
      const deepLinkParams = new URLSearchParams();
      if (accessToken) deepLinkParams.set('access_token', accessToken);
      if (refreshToken) deepLinkParams.set('refresh_token', refreshToken);
      if (tokenType) deepLinkParams.set('token_type', tokenType);
      if (type) deepLinkParams.set('type', type);
      if (expiresIn) deepLinkParams.set('expires_in', expiresIn);

      const deepLink = `studigo://auth-callback#${deepLinkParams.toString()}`;
      
      console.log('Attempting to open deep link:', deepLink);
      statusEl.textContent = 'Opening StudiGo app...';

      // Set up manual link as fallback
      manualLinkEl.href = deepLink;
      manualLinkEl.style.display = 'inline-block';

      // Try to open the app
      window.location.href = deepLink;

      // Show manual option after 2 seconds if still on page
      setTimeout(() => {
        statusEl.textContent = "If the app didn't open automatically:";
        manualLinkEl.textContent = 'Tap here to open StudiGo';
      }, 2000);

      // For Android, also try intent scheme
      if (/Android/i.test(navigator.userAgent)) {
        setTimeout(() => {
          const intentUrl = `intent://auth-callback#${deepLinkParams.toString()}#Intent;scheme=studigo;package=com.studigo.app;end`;
          window.location.href = intentUrl;
        }, 500);
      }

    })();
  </script>
</body>
</html>
